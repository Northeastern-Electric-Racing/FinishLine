name: finishline-development
services:
  database:
    container_name: database-dev
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: finishline_database
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d finishline_database']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    container_name: backend-dev
    build:
      context: ../
      dockerfile: devContainerization/Dockerfile.backend.dev
    ports:
      - '3001:3001'
    volumes:
      - ../src/backend:/src/backend
      - ../src/shared:/src/shared
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - ../src/backend/.env
    environment:
      DATABASE_URL: 'postgresql://postgres:docker@database:5432/finishline_database'

  frontend:
    container_name: frontend-dev
    build:
      context: ../
      dockerfile: devContainerization/Dockerfile.frontend.dev
    ports:
      - '3000:3000'
    volumes:
      - ../src/frontend:/src/frontend
      - ../src/shared:/src/shared
    depends_on:
      - backend

  postgres-exporter:
    container_name: postgres-exporter-dev
    image: prometheuscommunity/postgres-exporter
    profiles:
      - monitoring
    environment:
      DATA_SOURCE_NAME: 'postgresql://postgres:docker@database:5432/finishline_database?sslmode=disable'
    ports:
      - '9187:9187'
    depends_on:
      database:
        condition: service_healthy

  prometheus:
    container_name: prometheus-dev
    image: prom/prometheus
    profiles:
      - monitoring
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - postgres-exporter

  grafana:
    container_name: grafana-dev
    image: grafana/grafana
    profiles:
      - monitoring
    ports:
      - '4000:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    depends_on:
      - prometheus
      - database

volumes:
  pgdata:
  prometheus-data:
  grafana-data:
