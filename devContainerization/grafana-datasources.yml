apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: PostgreSQL
    type: postgres
    access: proxy
    url: database:5432
    database: finishline_database
    user: postgres
    secureJsonData:
      password: docker
    jsonData:
      sslmode: 'disable'
      postgresVersion: 1400
    editable: true