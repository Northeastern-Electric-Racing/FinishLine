name: Build Cron Image

on:
  push:
    branches: [multitenancy]
    paths:
      - 'src/cron/**'
      - 'package.json'
      - 'yarn.lock'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/cron/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/northeastern-electric-racing/finishline-cron:latest
            ghcr.io/northeastern-electric-racing/finishline-cron:${{ github.sha }}