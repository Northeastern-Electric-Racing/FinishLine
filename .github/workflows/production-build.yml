
name: Production Build

on:
  push:
    branches:
      - main
      - multitenancy

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18.17.1
          cache: 'yarn'
      - name: Yarn Install
        run: yarn install
      - name: Run Tests
        run: yarn containerize
